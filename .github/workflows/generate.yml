name: Deck of the day

on:
  workflow_dispatch:
    inputs:
      date:
        description: YYYY-MM-DD in Pacific time. Empty means today.
        required: false
        type: string
      force:
        description: Replace the deck if that day already exists
        required: false
        type: boolean
        default: false
  schedule:
    # Midnight US Pacific is 07:05 UTC during daylight time and 08:05 UTC in winter.
    # The generator keys off the Pacific date and leaves an existing file alone.
    - cron: '5 7 * * *'
    - cron: '5 8 * * *'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DECK_DATE: ${{ inputs.date }}
          DECK_FORCE: ${{ inputs.force }}
      - name: Commit the deck
        id: commit
        run: |
          git config user.name "daily-hero"
          git config user.email "daily-hero@users.noreply.github.com"
          git add decks
          if git diff --cached --quiet; then
            echo "Deck file already exists"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            # Not a conventional commit, so semantic-release leaves the version unchanged.
            git commit -m "Add the daily deck"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with GITHUB_TOKEN does not start the Test workflow.
      - name: Publish the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --ref main
