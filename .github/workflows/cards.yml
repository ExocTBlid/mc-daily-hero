name: Refresh card data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1'

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync-cards
      - name: Commit the card snapshot
        id: commit
        run: |
          git config user.name "daily-hero"
          git config user.email "daily-hero@users.noreply.github.com"
          git add data/player-cards.json
          if git diff --cached --quiet; then
            echo "Card snapshot is unchanged"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            # Not a conventional commit, so semantic-release leaves the version unchanged.
            git commit -m "Refresh the player card snapshot"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with GITHUB_TOKEN does not start the Test workflow.
      - name: Publish the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --ref main
